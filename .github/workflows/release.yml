name: Build Windows ARM64

on:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          pip install --no-deps qwen-tts
          pip install --no-deps chatterbox-tts
          pip install --no-deps hume-tada
          pip install --no-deps omnivoice

      - name: Build Python server (Windows ARM64)
        shell: bash
        run: |
          cd backend
          python build_binary.py
          python build_binary.py --shim

          PLATFORM=$(rustc --print host-tuple)
          mkdir -p ../tauri/src-tauri/binaries

          cp dist/voicebox-server.exe ../tauri/src-tauri/binaries/voicebox-server-${PLATFORM}.exe
          cp dist/voicebox-mcp.exe ../tauri/src-tauri/binaries/voicebox-mcp-${PLATFORM}.exe
          echo "Built voicebox-server-${PLATFORM}.exe"
          echo "Built voicebox-mcp-${PLATFORM}.exe"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (ARM64)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable (ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./tauri/src-tauri -> target"

      - name: Install frontend dependencies
        run: |
          bun install
          $rollupDir = Get-ChildItem -Path "node_modules\.bun" -Filter "rollup@*" -Directory | Select-Object -First 1
          if ($rollupDir) {
            npm pack @rollup/rollup-win32-arm64-msvc@4.56.0 --pack-destination $env:TEMP
            $tgz = Get-ChildItem -Path $env:TEMP -Filter "rollup-rollup-win32-arm64-msvc-*.tgz" | Select-Object -First 1
            $dest = Join-Path $rollupDir.FullName "node_modules\@rollup\rollup-win32-arm64-msvc"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            tar -xzf $tgz.FullName -C $dest --strip-components=1
          }

      - name: Build Tauri Windows ARM64 Installer
        working-directory: tauri
        env:
          CARGO_TERM_VERBOSE: "true"
          RUST_BACKTRACE: "1"
        run: |
          cargo install tauri-cli --version "^2.9" --locked
          cargo tauri build --target aarch64-pc-windows-msvc

      - name: Upload Windows ARM64 Installer
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-windows-arm64
          path: |
            tauri/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            tauri/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          pip install --no-deps qwen-tts
          pip install --no-deps chatterbox-tts
          pip install --no-deps hume-tada
          pip install --no-deps omnivoice
